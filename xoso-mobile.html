<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Xổ Số Miền Bắc</title>

<style>

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
}

.container{
    max-width:1000px;
    margin:auto;
}

.toolbar{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.start{
    background:#d40000;
}

.copy{
    background:#0d7f3f;
}

.copyUnique{
    background:#f08b00;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

td,th{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.prize{
    width:80px;
    font-weight:bold;
    background:#f7f7f7;
}

.result{
    font-size:22px;
    font-weight:bold;
    line-height:1.5;
}

.last2{
    color:#2b67a8;
}

.headTitle{
    background:#a9c5e7;
    font-weight:bold;
    width:60px;
}

.tailTitle{
    background:#a9c5e7;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-bottom:10px;
    padding:8px;
    background:#fff6cc;
    font-weight:bold;
    color:#a00000;
}

@media(max-width:768px){

    .result{
        font-size:18px;
    }

    td,th{
        padding:7px;
    }

    .prize{
        width:60px;
    }

    .toolbar{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="status" id="status">
Nhấn QUAY SỐ
</div>

<div class="toolbar">
<button class="start" onclick="startLottery()">
🎰 Quay số
</button>

<button class="copy" onclick="copyAll()">
📋 Copy tất cả
</button>

<button class="copyUnique" onclick="copyUnique()">
📋 Copy bỏ trùng
</button>
</div>

<table>

<tr>
<th class="prize"></th>
<th>Kết quả</th>
<th class="headTitle">Đầu</th>
<th class="tailTitle">Đuôi</th>
</tr>

<tr>
<td class="prize">ĐB</td>
<td id="db" class="result">00000</td>
<td rowspan="8" colspan="2" style="padding:0">
<table style="width:100%;height:100%">
<tbody id="dauDuoi"></tbody>
</table>
</td>
</tr>

<tr>
<td class="prize">Nhất</td>
<td id="g1" class="result">00000</td>
</tr>

<tr>
<td class="prize">Nhì</td>
<td id="g2" class="result">00000 - 00000</td>
</tr>

<tr>
<td class="prize">Ba</td>
<td id="g3" class="result"></td>
</tr>

<tr>
<td class="prize">Bốn</td>
<td id="g4" class="result"></td>
</tr>

<tr>
<td class="prize">Năm</td>
<td id="g5" class="result"></td>
</tr>

<tr>
<td class="prize">Sáu</td>
<td id="g6" class="result"></td>
</tr>

<tr>
<td class="prize">Bảy</td>
<td id="g7" class="result"></td>
</tr>

</table>

</div>

<script>

const prizes = [
{
id:"db",
count:1,
digits:5
},
{
id:"g1",
count:1,
digits:5
},
{
id:"g2",
count:2,
digits:5
},
{
id:"g3",
count:6,
digits:5
},
{
id:"g4",
count:4,
digits:4
},
{
id:"g5",
count:6,
digits:4
},
{
id:"g6",
count:3,
digits:3
},
{
id:"g7",
count:4,
digits:2
}
];

let lotoNumbers=[];

function randomNumber(length){

    let max=Math.pow(10,length);

    return Math.floor(Math.random()*max)
        .toString()
        .padStart(length,'0');
}

function highlight(number){

    let start=number.slice(0,-2);
    let end=number.slice(-2);

    return `${start}<span class="last2">${end}</span>`;
}

async function drawPrize(prize){

    let el=document.getElementById(prize.id);

    let html=[];

    for(let i=0;i<prize.count;i++){

        let num=randomNumber(prize.digits);

        html.push(highlight(num));

        lotoNumbers.push(
            num.slice(-2)
        );
    }

    el.innerHTML=html.join(" - ");

    updateDauDuoi();

    await sleep(120);
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

async function startLottery(){

    lotoNumbers=[];

    document.getElementById("status")
        .innerHTML="Đang quay...";

    for(const prize of prizes){

        await drawPrize(prize);
    }

    document.getElementById("status")
        .innerHTML="🎉 Hoàn tất";
}

function updateDauDuoi(){

    let html=`
    <tr>
        <th>Đầu</th>
        <th>Đuôi</th>
    </tr>
    `;

    for(let i=0;i<=9;i++){

        let dau=lotoNumbers
        .filter(x=>x[0]==i)
        .map(x=>x[1]);

        html+=`
        <tr>
            <td style="background:#a9c5e7;font-weight:bold">
                ${i}
            </td>
            <td>
                ${dau.join(",")}
            </td>
        </tr>
        `;
    }

    document.getElementById("dauDuoi")
        .innerHTML=html;
}

async function copyAll(){

    if(!lotoNumbers.length) return;

    let text=lotoNumbers.join(", ");

    await navigator.clipboard.writeText(text);

    alert("Đã copy tất cả");
}

async function copyUnique(){

    if(!lotoNumbers.length) return;

    let unique=[
        ...new Set(lotoNumbers)
    ];

    await navigator.clipboard.writeText(
        unique.join(", ")
    );

    alert("Đã copy danh sách bỏ trùng");
}

updateDauDuoi();

</script>

</body>
</html>
``
