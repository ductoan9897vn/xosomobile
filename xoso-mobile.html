<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no"
    >
    <meta name="theme-color" content="#c90000">

    <title>Quay thưởng Xổ số Miền Bắc</title>

    <style>
        :root {
            --red: #cc0000;
            --dark-red: #960000;
            --yellow: #ffc107;
            --border: #e3e3e3;
            --background: #f2f3f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
        }

        /* Header */

        .header {
            padding: 15px 10px;
            text-align: center;
            color: #fff;
            background: linear-gradient(
                135deg,
                var(--red),
                var(--dark-red)
            );
        }

        .header h1 {
            margin: 0;
            font-size: 23px;
        }

        .header p {
            margin: 5px 0 0;
            color: #ffd5d5;
            font-size: 12px;
        }

        /* Điều khiển quay */

        .controls {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .control-button {
            flex: 1;
            min-height: 44px;
            padding: 10px 6px;
            color: #fff;
            border: 0;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .control-button:active:not(:disabled),
        .lotto-button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .control-button:disabled,
        .lotto-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #startButton {
            background: #d00000;
        }

        #resetButton {
            background: #555;
        }

        .status {
            min-height: 37px;
            padding: 10px;
            text-align: center;
            color: #a00000;
            background: #fff4bf;
            border-bottom: 1px solid #efd477;
            font-size: 13px;
            font-weight: bold;
        }

        /* Bảng giải thưởng */

        .result-board {
            border-bottom: 6px solid var(--background);
        }

        .prize-row {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            min-height: 61px;
            border-bottom: 1px solid var(--border);
        }

        .prize-label {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a90000;
            background: #fff8e8;
            border-right: 1px solid var(--border);
            font-size: 13px;
            font-weight: bold;
        }

        .prize-content {
            display: grid;
            grid-template-columns: repeat(
                var(--columns),
                minmax(0, 1fr)
            );
            align-content: center;
            gap: 8px 3px;
            padding: 9px 4px;
        }

        .number {
            display: flex;
            justify-content: center;
            gap: 2px;
            min-width: 0;
        }

        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            flex: 0 0 27px;
            color: #222;
            background: linear-gradient(
                145deg,
                #ffec9e,
                var(--yellow)
            );
            border: 1px solid #dda900;
            border-radius: 50%;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.14);
            font-size: 15px;
            font-weight: 800;
        }

        .special-row {
            background: #fff7f7;
        }

        .special-row .prize-label {
            color: #fff;
            background: var(--red);
        }

        .special-row .ball {
            width: 38px;
            height: 38px;
            flex-basis: 38px;
            color: #fff;
            background: linear-gradient(
                145deg,
                #ff6262,
                #ba0000
            );
            border-color: #990000;
            font-size: 21px;
        }

        .active-row {
            background: #fff2b1;
            box-shadow: inset 4px 0 var(--red);
        }

        .ball.spinning {
            color: #fff;
            background: #dc0000;
            border-color: #a80000;
            animation: ballShake 0.09s infinite alternate;
        }

        .ball.finished {
            animation: ballFinish 0.22s ease;
        }

        @keyframes ballShake {
            from {
                transform: translateY(-2px) rotate(-5deg);
            }

            to {
                transform: translateY(2px) rotate(5deg);
            }
        }

        @keyframes ballFinish {
            0% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Khu vực lô tô */

        .lotto-section {
            margin: 10px;
            overflow: hidden;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .section-title {
            padding: 11px 8px;
            text-align: center;
            color: #fff;
            background: linear-gradient(
                135deg,
                var(--red),
                var(--dark-red)
            );
            font-size: 14px;
            font-weight: bold;
        }

        .lotto-summary {
            padding: 8px 10px;
            text-align: center;
            color: #555;
            background: #fff7da;
            border-bottom: 1px solid #ead58c;
            font-size: 12px;
            font-weight: bold;
        }

        .lotto-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 54px;
            padding: 10px;
            background: #fffaf0;
        }

        .empty-message {
            width: 100%;
            padding: 8px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .lotto-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 35px;
            height: 31px;
            padding: 0 7px;
            color: #333;
            background: #fff;
            border: 1px solid #e1c363;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .lotto-item.duplicate {
            color: #fff;
            background: var(--red);
            border-color: var(--dark-red);
        }

        .duplicate-count {
            margin-left: 3px;
            font-size: 10px;
            font-weight: normal;
        }

        /* Nút sao chép và lọc */

        .lotto-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
            padding: 9px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .lotto-button {
            min-height: 39px;
            padding: 7px 3px;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #copyButton {
            background: #087f23;
        }

        #filterButton {
            background: #d67a00;
        }

        #showAllButton {
            background: #4d5965;
        }

        .copy-message {
            display: none;
            padding: 8px;
            text-align: center;
            color: #087f23;
            background: #eaffee;
            border-top: 1px solid #b7dec0;
            font-size: 12px;
            font-weight: bold;
        }

        .copy-message.visible {
            display: block;
        }

        /* Bảng đầu đuôi */

        .statistics-header,
        .statistics-row {
            display: grid;
            grid-template-columns:
                42px minmax(0, 1fr)
                42px minmax(0, 1fr);
        }

        .statistics-header {
            color: #fff;
            background: #4c4c4c;
            font-size: 13px;
            font-weight: bold;
        }

        .statistics-header > div,
        .statistics-row > div {
            padding: 8px 5px;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .statistics-header > div:last-child,
        .statistics-row > div:last-child {
            border-right: 0;
        }

        .statistics-row:last-child > div {
            border-bottom: 0;
        }

        .stat-digit {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c00000;
            background: #fff6d8;
            font-weight: bold;
        }

        .stat-result {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            min-height: 36px;
            font-size: 13px;
            font-weight: bold;
        }

        .stat-value {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 20px;
            height: 22px;
            padding: 0 4px;
            background: #f2f2f2;
            border-radius: 4px;
        }

        .stat-value.duplicate {
            color: #fff;
            background: var(--red);
        }

        .stat-empty {
            color: #aaa;
            font-weight: normal;
        }

        .note {
            margin: 10px;
            padding: 10px;
            color: #666;
            background: #f7f7f7;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 370px) {
            .header h1 {
                font-size: 20px;
            }

            .prize-row {
                grid-template-columns: 42px minmax(0, 1fr);
            }

            .ball {
                width: 24px;
                height: 24px;
                flex-basis: 24px;
                font-size: 13px;
            }

            .special-row .ball {
                width: 33px;
                height: 33px;
                flex-basis: 33px;
                font-size: 18px;
            }

            .statistics-header,
            .statistics-row {
                grid-template-columns:
                    34px minmax(0, 1fr)
                    34px minmax(0, 1fr);
            }

            .statistics-header > div,
            .statistics-row > div {
                padding: 7px 3px;
            }

            .stat-result {
                gap: 2px;
                font-size: 12px;
            }

            .lotto-button {
                font-size: 11px;
            }
        }

        @media (min-width: 520px) {
            body {
                padding: 15px 0;
            }

            .app {
                min-height: auto;
                overflow: hidden;
                border-radius: 16px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.15);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>🎰 XỔ SỐ MIỀN BẮC</h1>
        <p>Mô phỏng quay thưởng bằng số ngẫu nhiên</p>
    </header>

    <div class="controls">
        <button
            class="control-button"
            id="startButton"
            type="button"
        >
            ▶ Bắt đầu quay
        </button>

        <button
            class="control-button"
            id="resetButton"
            type="button"
        >
            ↻ Làm mới
        </button>
    </div>

    <div class="status" id="status">
        Nhấn “Bắt đầu quay” để bắt đầu
    </div>

    <main class="result-board" id="resultBoard"></main>

    <section class="lotto-section">
        <div class="section-title">
            DANH SÁCH 2 SỐ CUỐI
        </div>

        <div class="lotto-summary" id="lottoSummary">
            Chưa có kết quả
        </div>

        <div class="lotto-list" id="lottoList">
            <div class="empty-message">
                Chưa có kết quả
            </div>
        </div>

        <div class="lotto-actions">
            <button
                class="lotto-button"
                id="copyButton"
                type="button"
                disabled
            >
                📋 Sao chép
            </button>

            <button
                class="lotto-button"
                id="filterButton"
                type="button"
                disabled
            >
                🔍 Lọc trùng
            </button>

            <button
                class="lotto-button"
                id="showAllButton"
                type="button"
                disabled
            >
                ↩ Hiện tất cả
            </button>
        </div>

        <div class="copy-message" id="copyMessage">
            Đã sao chép danh sách!
        </div>
    </section>

    <section class="lotto-section">
        <div class="section-title">
            THỐNG KÊ ĐẦU ĐUÔI
        </div>

        <div class="statistics-header">
            <div>Đầu</div>
            <div>Lô tô</div>
            <div>Đuôi</div>
            <div>Lô tô</div>
        </div>

        <div id="statisticsBody"></div>
    </section>

    <div class="note">
        Ứng dụng chỉ mô phỏng sinh số ngẫu nhiên,
        không phải kết quả xổ số chính thức.
    </div>

</div>

<script>
    const prizes = [
        {
            id: "db",
            label: "ĐB",
            name: "Giải đặc biệt",
            digits: 5,
            quantity: 1,
            columns: 1,
            special: true
        },
        {
            id: "g1",
            label: "G1",
            name: "Giải nhất",
            digits: 5,
            quantity: 1,
            columns: 1
        },
        {
            id: "g2",
            label: "G2",
            name: "Giải nhì",
            digits: 5,
            quantity: 2,
            columns: 2
        },
        {
            id: "g3",
            label: "G3",
            name: "Giải ba",
            digits: 5,
            quantity: 6,
            columns: 2
        },
        {
            id: "g4",
            label: "G4",
            name: "Giải tư",
            digits: 4,
            quantity: 4,
            columns: 2
        },
        {
            id: "g5",
            label: "G5",
            name: "Giải năm",
            digits: 4,
            quantity: 6,
            columns: 2
        },
        {
            id: "g6",
            label: "G6",
            name: "Giải sáu",
            digits: 3,
            quantity: 3,
            columns: 3
        },
        {
            id: "g7",
            label: "G7",
            name: "Giải bảy",
            digits: 2,
            quantity: 4,
            columns: 4
        }
    ];

    const drawOrder = [
        "g7",
        "g6",
        "g5",
        "g4",
        "g3",
        "g2",
        "g1",
        "db"
    ];

    const SPIN_TIME = 200;
    const BETWEEN_PRIZES_TIME = 50;
    const DIGIT_CHANGE_TIME = 35;

    const resultBoard =
        document.getElementById("resultBoard");

    const statusElement =
        document.getElementById("status");

    const startButton =
        document.getElementById("startButton");

    const resetButton =
        document.getElementById("resetButton");

    const lottoList =
        document.getElementById("lottoList");

    const lottoSummary =
        document.getElementById("lottoSummary");

    const statisticsBody =
        document.getElementById("statisticsBody");

    const copyButton =
        document.getElementById("copyButton");

    const filterButton =
        document.getElementById("filterButton");

    const showAllButton =
        document.getElementById("showAllButton");

    const copyMessage =
        document.getElementById("copyMessage");

    let drawing = false;
    let spinTimers = [];
    let filterMode = "all";
    let copyMessageTimer = null;

    function randomDigit() {
        return Math.floor(Math.random() * 10);
    }

    function wait(milliseconds) {
        return new Promise(resolve => {
            setTimeout(resolve, milliseconds);
        });
    }

    function createBoard() {
        resultBoard.innerHTML = "";

        prizes.forEach(prize => {
            const row = document.createElement("section");

            row.id = `row-${prize.id}`;
            row.className = "prize-row";

            if (prize.special) {
                row.classList.add("special-row");
            }

            const label = document.createElement("div");
            label.className = "prize-label";
            label.textContent = prize.label;

            const content = document.createElement("div");
            content.id = prize.id;
            content.className = "prize-content";

            content.style.setProperty(
                "--columns",
                prize.columns
            );

            for (
                let numberIndex = 0;
                numberIndex < prize.quantity;
                numberIndex++
            ) {
                const number = document.createElement("div");

                number.className = "number";
                number.dataset.finished = "false";

                for (
                    let digitIndex = 0;
                    digitIndex < prize.digits;
                    digitIndex++
                ) {
                    const ball = document.createElement("span");

                    ball.className = "ball";
                    ball.textContent = "0";

                    number.appendChild(ball);
                }

                content.appendChild(number);
            }

            row.appendChild(label);
            row.appendChild(content);
            resultBoard.appendChild(row);
        });
    }

    function getNumberFromElement(numberElement) {
        return [...numberElement.querySelectorAll(".ball")]
            .map(ball => ball.textContent)
            .join("");
    }

    function getAllLottoNumbers() {
        const numbers = [];

        prizes.forEach(prize => {
            const prizeElement =
                document.getElementById(prize.id);

            const finishedNumbers =
                prizeElement.querySelectorAll(
                    '.number[data-finished="true"]'
                );

            finishedNumbers.forEach(numberElement => {
                const fullNumber =
                    getNumberFromElement(numberElement);

                numbers.push(fullNumber.slice(-2));
            });
        });

        return numbers;
    }

    function createFrequencyMap(numbers) {
        return numbers.reduce((map, number) => {
            map[number] = (map[number] || 0) + 1;
            return map;
        }, {});
    }

    /*
     * Lọc trùng theo kiểu chỉ giữ mỗi số một lần.
     *
     * Ví dụ:
     * 12, 34, 12, 56, 34
     * trở thành:
     * 12, 34, 56
     */
    function getUniqueNumbers(numbers) {
        return [...new Set(numbers)];
    }

    function getVisibleNumbers() {
        const allNumbers = getAllLottoNumbers();

        if (filterMode === "unique") {
            return getUniqueNumbers(allNumbers);
        }

        return allNumbers;
    }

    function renderLottoList() {
        const allNumbers = getAllLottoNumbers();
        const visibleNumbers = getVisibleNumbers();
        const frequencyMap = createFrequencyMap(allNumbers);
        const uniqueCount = getUniqueNumbers(allNumbers).length;
        const duplicateEntries =
            allNumbers.length - uniqueCount;

        if (allNumbers.length === 0) {
            lottoList.innerHTML = `
                <div class="empty-message">
                    Chưa có kết quả
                </div>
            `;

            lottoSummary.textContent = "Chưa có kết quả";

            copyButton.disabled = true;
            filterButton.disabled = true;
            showAllButton.disabled = true;

            return;
        }

        lottoSummary.textContent =
            `Tổng ${allNumbers.length} số` +
            ` • ${uniqueCount} số khác nhau` +
            ` • ${duplicateEntries} lượt trùng`;

        lottoList.innerHTML = visibleNumbers
            .map(number => {
                const count = frequencyMap[number];
                const duplicateClass =
                    count > 1 ? "duplicate" : "";

                const countHTML =
                    filterMode === "unique" && count > 1
                        ? `<small class="duplicate-count">×${count}</small>`
                        : "";

                return `
                    <span class="lotto-item ${duplicateClass}">
                        ${number}${countHTML}
                    </span>
                `;
            })
            .join("");

        copyButton.disabled = false;
        filterButton.disabled = false;

        showAllButton.disabled =
            filterMode === "all";

        filterButton.disabled =
            filterMode === "unique";
    }

    function renderStatValues(items) {
        if (items.length === 0) {
            return `<span class="stat-empty">-</span>`;
        }

        return items
            .map(item => {
                const duplicateClass =
                    item.duplicate ? "duplicate" : "";

                return `
                    <span class="stat-value ${duplicateClass}">
                        ${item.value}
                    </span>
                `;
            })
            .join("");
    }

    function updateStatistics() {
        const numbers = getAllLottoNumbers();
        const frequencyMap = createFrequencyMap(numbers);

        renderLottoList();

        let tableHTML = "";

        for (let digit = 0; digit <= 9; digit++) {
            const digitText = String(digit);

            const headItems = numbers
                .filter(number => {
                    return number.charAt(0) === digitText;
                })
                .map(number => {
                    return {
                        value: number.charAt(1),
                        duplicate: frequencyMap[number] > 1
                    };
                });

            const tailItems = numbers
                .filter(number => {
                    return number.charAt(1) === digitText;
                })
                .map(number => {
                    return {
                        value: number.charAt(0),
                        duplicate: frequencyMap[number] > 1
                    };
                });

            tableHTML += `
                <div class="statistics-row">
                    <div class="stat-digit">${digit}</div>

                    <div class="stat-result">
                        ${renderStatValues(headItems)}
                    </div>

                    <div class="stat-digit">${digit}</div>

                    <div class="stat-result">
                        ${renderStatValues(tailItems)}
                    </div>
                </div>
            `;
        }

        statisticsBody.innerHTML = tableHTML;
    }

    function clearSpinTimers() {
        spinTimers.forEach(timer => {
            clearInterval(timer);
        });

        spinTimers = [];
    }

    async function spinPrize(prize) {
        const row = document.getElementById(
            `row-${prize.id}`
        );

        const prizeElement =
            document.getElementById(prize.id);

        const balls =
            prizeElement.querySelectorAll(".ball");

        const numberElements =
            prizeElement.querySelectorAll(".number");

        row.classList.add("active-row");

        statusElement.textContent =
            `Đang quay ${prize.name}...`;

        balls.forEach(ball => {
            ball.classList.remove("finished");
            ball.classList.add("spinning");

            const timer = setInterval(() => {
                ball.textContent = randomDigit();
            }, DIGIT_CHANGE_TIME);

            spinTimers.push(timer);
        });

        await wait(SPIN_TIME);

        clearSpinTimers();

        balls.forEach(ball => {
            ball.textContent = randomDigit();
            ball.classList.remove("spinning");
            ball.classList.add("finished");
        });

        numberElements.forEach(numberElement => {
            numberElement.dataset.finished = "true";
        });

        row.classList.remove("active-row");
        updateStatistics();

        await wait(BETWEEN_PRIZES_TIME);
    }

    function resetNumbers() {
        clearSpinTimers();

        document.querySelectorAll(".ball").forEach(ball => {
            ball.textContent = "0";

            ball.classList.remove(
                "spinning",
                "finished"
            );
        });

        document.querySelectorAll(".number").forEach(
            numberElement => {
                numberElement.dataset.finished = "false";
            }
        );

        document.querySelectorAll(".prize-row").forEach(
            row => {
                row.classList.remove("active-row");
            }
        );

        filterMode = "all";
        hideCopyMessage();
        updateStatistics();
    }

    async function startLottery() {
        if (drawing) {
            return;
        }

        drawing = true;
        filterMode = "all";

        startButton.disabled = true;
        resetButton.disabled = true;

        resetNumbers();

        for (const prizeId of drawOrder) {
            const prize = prizes.find(item => {
                return item.id === prizeId;
            });

            await spinPrize(prize);
        }

        statusElement.textContent =
            "🎉 Đã hoàn thành tất cả các giải";

        startButton.disabled = false;
        resetButton.disabled = false;
        drawing = false;
    }

    function resetLottery() {
        if (drawing) {
            return;
        }

        resetNumbers();

        statusElement.textContent =
            "Nhấn “Bắt đầu quay” để bắt đầu";
    }

    /*
     * Sao chép danh sách đang hiển thị.
     *
     * Khi đã lọc trùng, nút này sẽ sao chép
     * danh sách không lặp lại.
     */
    async function copyVisibleNumbers() {
        const numbers = getVisibleNumbers();

        if (numbers.length === 0) {
            return;
        }

        const text = numbers.join(", ");

        try {
            await navigator.clipboard.writeText(text);
            showCopyMessage("Đã sao chép danh sách!");
        } catch (error) {
            fallbackCopy(text);
        }
    }

    /*
     * Dự phòng cho trình duyệt cũ hoặc khi mở
     * file HTML trực tiếp không hỗ trợ Clipboard API.
     */
    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");

        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.setAttribute("readonly", "");

        document.body.appendChild(textArea);
        textArea.select();
        textArea.setSelectionRange(
            0,
            textArea.value.length
        );

        try {
            document.execCommand("copy");
            showCopyMessage("Đã sao chép danh sách!");
        } catch (error) {
            showCopyMessage(
                "Không thể sao chép trên trình duyệt này",
                true
            );
        }

        textArea.remove();
    }

    function showCopyMessage(message, isError = false) {
        clearTimeout(copyMessageTimer);

        copyMessage.textContent = message;
        copyMessage.style.color =
            isError ? "#b00000" : "#087f23";

        copyMessage.classList.add("visible");

        copyMessageTimer = setTimeout(() => {
            hideCopyMessage();
        }, 1600);
    }

    function hideCopyMessage() {
        clearTimeout(copyMessageTimer);
        copyMessage.classList.remove("visible");
    }

    function filterDuplicates() {
        filterMode = "unique";
        renderLottoList();
    }

    function showAllNumbers() {
        filterMode = "all";
        renderLottoList();
    }

    startButton.addEventListener(
        "click",
        startLottery
    );

    resetButton.addEventListener(
        "click",
        resetLottery
    );

    copyButton.addEventListener(
        "click",
        copyVisibleNumbers
    );

    filterButton.addEventListener(
        "click",
        filterDuplicates
    );

    showAllButton.addEventListener(
        "click",
        showAllNumbers
    );

    createBoard();
    updateStatistics();
</script>

</body>
</html>
